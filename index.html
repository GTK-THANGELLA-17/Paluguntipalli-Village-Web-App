<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paluguntipalli Official Village Website</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Paluguntipalli – official village website of Andhra Pradesh. Discover culture, events, and local news." />
    <meta name="keywords" content="Paluguntipalli, Paluguntipalli Village, Andhra Pradesh, Village News, Indian Villages" />
    <meta name="author" content="Paluguntipalli Community" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="shortcut icon" href="/favicon.jpg" type="image/jpeg" />

    <!-- Open Graph Meta Tags (for social sharing) -->
    <meta property="og:title" content="Paluguntipalli - Heritage Hub of Andhra Pradesh" />
    <meta property="og:description" content="Discover Paluguntipalli village: culture, festivals, local updates and more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.paluguntipalli.com" />
    <meta property="og:image" content="https://www.paluguntipalli.com/favicon.jpg" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Paluguntipalli - Official Village Website" />
    <meta name="twitter:description" content="Paluguntipalli is a village in Andhra Pradesh. Get updates, news, and community info." />
    <meta name="twitter:image" content="https://www.paluguntipalli.com/favicon.jpg" />

    <!-- Favicon Schema for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "url": "https://www.paluguntipalli.com",
        "logo": "https://www.paluguntipalli.com/favicon.jpg"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Load your frontend code -->
    <script type="module" src="/src/main.tsx"></script>
